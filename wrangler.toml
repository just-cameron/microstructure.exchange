  { pattern = "microstructure.exchange/", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/index.html", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/season.html", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/season", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/about.html", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/about", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/award.html", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/award", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/resources.html", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/resources", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/past-talks.html", zone_name = "microstructure.exchange" },
  { pattern = "microstructure.exchange/past-talks", zone_name = "microstructure.exchange" },
